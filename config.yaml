# OpenRAPM's data constants and paths, read by every command through src/openrapm/data/config.py.  The model's
# settings (penalties, inputs, folds) live in src/openrapm/settings.py, each beside the experiment that set it.

# Seasons are named by the year they end (1997 = 1996-97).
first_season: 1997    # the first season ingested, built and rated
last_season: 2026     # the last; it may still be in progress (data/seasons.py decides what may be trained on)
windows:              # the decomposition page's ten three-season windows (openrapm site --decomposition)
  - [1997, 1999]
  - [2000, 2002]
  - [2003, 2005]
  - [2006, 2008]
  - [2009, 2011]
  - [2012, 2014]
  - [2015, 2017]
  - [2018, 2020]
  - [2021, 2023]
  - [2024, 2026]
neutral_site_seasons_po: [2020]   # playoffs played at a neutral site (the 2020 bubble): home court is 0 there
neutral_site_from: [[2020, "2020-07-01"]]   # [season, date]: every game of the season from that date at a neutral site,
                                            # the bubble's 88 regular-season games, which the game log lists with a home team

# The raw per-game box counts every design carries, in this order (the stored design pieces record it).
box_counts: [fg3m, fg3_miss, fg2m, fg2_miss, ftm, ft_miss, orb, drb, ast, tov, stl, blk, pf]

# a design's player columns: one per player over the design's seasons ("player"), or one per player-season
# ("player_season"); the two give the same matrix for one season, the design every step fits
player_unit: player
low_poss_threshold: 500       # the design's diagnostic player groups: under this many possessions is "low_poss"
starter_poss_threshold: 1500  # and this many or more is "high_poss"; neither moves a rating
pad_target: poss_conditional  # what the season panel's box rates are padded toward (box_rates.py): the rate of players
                              # with about as many possessions; the league rate did no better (FINDINGS 21.14,
                              # git show archive/research-2026-09:FINDINGS.md)
pad_k_around: target          # where the pad k measures the spread between players: around the target the rates are
                              # padded toward, as shipped since experiment 99 (2026-10-22), or around the league rate
                              # ("league", before it)
body_inputs: season_listing   # height and weight: each season's own listing on the barefoot ruler, as shipped since
                              # experiment 99, or each player's median listing over his career ("career_median")

# Garbage time (data/stint_parser.py): a stint in it is flagged, and the design carries the flag as a context column.
garbage_time:
  q4_margin_late: 15    # 4th quarter, margin of 15 or more with under `late_minutes` left
  late_minutes: 6       # the minutes left in the 4th that q4_margin_late applies to
  q4_margin_any: 20     # or a margin of 20 or more at any point in the 4th
gt_weight: 1.0          # a garbage-time row's weight relative to any other row's (1.0: the same)
margin_clip: 25         # the score-margin context columns are clipped at plus or minus this many points

# The role inputs of the season panel (src/openrapm/data/roles.py).
roles:
  cache: roles.parquet  # the roles table's file in paths.cache; the phases join the name: roles_RSPO.parquet
  share_cap: 0.9        # the share of team possessions played is capped here

# Data paths: relative to the repository root, or absolute.  `openrapm --config FILE` or OPENRAPM_CONFIG=FILE makes
# every command read another config.yaml instead of this one, so a check can point all of them at another folder.
paths:
  raw: data/raw                         # openrapm data ingest: game logs, play-by-play, box scores, bio feed
  stints: data/stints                   # openrapm data stints: the stints, their diagnostics, names and shots
  cache: data/cache                     # rebuildable caches: the roles table, bio.parquet, the per-season design pieces
  shot_curves: data/shotcurve           # the league's make probability by distance, one file per season
  outputs: outputs                      # the ratings tables, the saved boosters, the checks' outputs
  panel: outputs/season_panel.parquet   # openrapm data panel: one row per player, season and side
  within: outputs/within                # openrapm folds: the within-season folds, one folder per tag
  event_counts: data/event_counts       # openrapm data events: play-by-play counts per game, player and phase
