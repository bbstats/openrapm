[project]
name = "eracoef"
version = "0.1.0"
description = "era-coefs: how NBA box-score coefficients drift across eras (mixed-model RAPM)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",          # groupby().apply(include_groups=) lands in 2.2; used in six places
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "chimeraboost>=0.34",
  "lightgbm>=4.7",        # the shipped box-score prior since 2026-10-08 (eracoef.lgbprior), and the shot models
  "xgboost>=3.0",         # the shot-quality learners (eracoef.shotlearners)
  "catboost>=1.2",        # the shot-quality learners (eracoef.shotlearners)
  "optuna>=4.0",          # the shot-quality search and the booster tuning (scripts 94, 136)
  "joblib>=1.3",          # leave-one-player-out fits in parallel processes (eracoef.lgbprior)
  "shap>=0.44",
  "BorutaShap>=1.0.17",
  "plotly>=5.18",
  "matplotlib>=3.8",
  "nba_api>=1.4",
  "pyyaml>=6",
  "kaleido>=0.2.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: recomputes a calibration table; a few seconds, not milliseconds",
  "network: genuinely needs the network; exempt from the block in tests/conftest.py",
]
