[project]
name = "openrapm"
version = "0.1.0"
description = "OpenRAPM: open NBA player-impact ratings, RAPM with a box-score prior, one rating per player per season"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",          # groupby().apply(include_groups=) lands in 2.2; used in six places
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "chimeraboost>=0.34",   # imported by scripts/62_single_year_board.py and openrapm.stackprior until 62 is replaced
  "lightgbm>=4.7",        # the shipped box-score prior since 2026-10-08 (openrapm.lgbprior)
  "joblib>=1.3",          # leave-one-player-out fits in parallel processes (openrapm.lgbprior)
  "matplotlib>=3.8",
  "nba_api>=1.4",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: recomputes a calibration table; a few seconds, not milliseconds",
  "network: genuinely needs the network; exempt from the block in tests/conftest.py",
]
