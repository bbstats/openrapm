[project]
name = "openrapm"
version = "0.1.0"
description = "OpenRAPM: open NBA player-impact ratings, RAPM with a box-score prior, one rating per player per season"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",          # groupby().apply(include_groups=) lands in 2.2; used in six places
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "threadpoolctl>=3",     # one linear-algebra thread in the checks (openrapm.commands.console.one_thread)
  "lightgbm>=4.7",        # the shipped box-score prior since 2026-10-08 (openrapm.box_prior)
  "matplotlib>=3.8",
  "nba_api>=1.4",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.scripts]
openrapm = "openrapm.commands.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: recomputes a calibration table; a few seconds, not milliseconds",
  "network: genuinely needs the network; exempt from the block in tests/conftest.py",
]
