<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRAPM: bias</title>
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<style>
  :root { --line: #d9d8d3; --muted: #6b6a66; --ink: #1a1a19; --accent: #2a78d6;
          --over: 227 73 72; --under: 42 120 214; }
  :root[data-theme="dark"] { --line: #3a3a38; --muted: #a09f98; --ink: #f2f1ee; --accent: #3987e5;
          --over: 230 103 103; --under: 57 135 229; }
  body { color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1 { margin-bottom: 0; }
  .lede { margin: 6px 0 4px; }
  .byline { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: separate; border-spacing: 2px 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; vertical-align: bottom; }
  th.name, td.name { text-align: left; }
  /* the numbers keep one width, so a colored cell is a small block and the stat's name takes the rest of the row */
  #table { max-width: 560px; }
  #table th:not(.name), #table td:not(.name) { width: 104px; }
  #systems th:not(.name), #systems td:not(.name) { width: 104px; }
  #table th { cursor: pointer; user-select: none; }
  #table th:hover { color: var(--ink); }
  /* every header keeps room for the sort arrow, so sorting never shifts the columns */
  #table th[data-k]::after { content: "\2193"; margin-left: 3px; visibility: hidden; }
  #table th[aria-sort="descending"]::after { visibility: visible; }
  #table th[aria-sort="ascending"]::after { content: "\2191"; visibility: visible; }
  #table th[aria-sort="descending"], #table th[aria-sort="ascending"] { color: var(--accent); }
  /* red: OpenRAPM rates those players higher than the consensus; blue: lower; the depth grows with the size */
  td.over, td.under { border-radius: 4px; font-weight: 700; }
  td.over { background: rgb(var(--over) / calc(var(--depth) * 0.55)); }
  td.under { background: rgb(var(--under) / calc(var(--depth) * 0.55)); }
  tfoot td { color: var(--muted); }
  td.msg { text-align: left; color: var(--muted); }
  .dl { margin: 10px 0 0; color: var(--muted); font-size: 13px; } .dl a { color: inherit; }
  #systems { margin-top: 30px; }
  #systems td a { color: inherit; text-underline-offset: 2px; }
  #systems td a:hover, #systems td a:focus-visible { color: var(--accent); }
  footer { margin-top: 24px; color: var(--muted); font-size: 12.5px; }
  footer a { color: inherit; }
  @media (max-width: 600px) {
    body { font-size: 13.5px; }
    th, td { padding: 7px 5px; }
    table { font-size: 13px; }
    /* narrower numbers, and a long name takes two lines, so both tables fit the phone's width */
    #table th:not(.name), #table td:not(.name) { width: 62px; }
    #systems th:not(.name), #systems td:not(.name) { width: auto; }
    td.name, th.name { white-space: normal; }
  }
</style>
</head>
<body>
<main>
  <nav class="site">
    <a href="./">Ratings</a>
    <a href="power.html" hidden>Power</a>
    <a href="similarity.html">~ Similarity</a>
    <a href="bias.html" aria-current="page">Bias</a>
    <a href="about.html">About</a>
    <a href="changelog.html">Changelog</a>
    <button class="theme" type="button" aria-label="Dark mode" title="Dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
  </nav>
  <h1>Bias</h1>
  <p class="lede">OpenRAPM minus a consensus of five public metrics, per 1 standard deviation of each stat, in points per 100</p>
  <p class="byline" id="byline">&nbsp;</p>
  <div class="scroll">
    <table id="table"><thead></thead><tbody><tr><td class="msg" colspan="99">Loading&hellip;</td></tr></tbody><tfoot></tfoot></table>
  </div>
  <p class="dl"><a href="#" id="csv">Download CSV</a></p>
  <div class="scroll">
    <table id="systems"><thead></thead><tbody></tbody></table>
  </div>
  <footer><a href="https://github.com/bbstats/openrapm">github.com/bbstats/openrapm</a></footer>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  // a true minus sign, and Math.round rather than toFixed, as on the ratings page
  const sign = v => v > 0 ? "+" : v < 0 ? "−" : "";
  const fmt = v => { const r = Math.round(v * 100) / 100 || 0; return sign(r) + Math.abs(r).toFixed(2); };
  const plain = v => v.toFixed(2);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const day = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const median = values => { const s = [...values].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

  const FULL = 0.5;      // a number this far from 0, in points per 100, takes the full color
  // the sides' columns, [key in the file, header]; a row in the file is a list in meta.fields order
  const COLUMNS = [["t", "Total"]];      // the owner, 2026-11-05: "i dont want off/def, just do total"
  const state = { sort: null };      // null: the file's order, the box score's; else { k, dir }
  const table = $("table"), thead = table.querySelector("thead"), tbody = table.querySelector("tbody"),
        tfoot = table.querySelector("tfoot");
  let data = null, rows = [];

  function cell(value, error) {
    if (value === null) return `<td>—</td>`;
    const pole = value > 0 ? "over" : value < 0 ? "under" : "";
    const depth = Math.min(Math.abs(value) / FULL, 1).toFixed(3);
    const title = error === null ? "" : ` title="±${plain(error)}"`;
    return `<td${pole ? ` class="${pole}" style="--depth: ${depth}"` : ""}${title}>${fmt(value)}</td>`;
  }

  function render() {
    const sorted = state.sort ? [...rows].sort((a, b) => state.sort.dir * (a[state.sort.k] - b[state.sort.k])) : rows;
    const th = (key, name) => `<th data-k="${key}"${state.sort && state.sort.k === key
      ? ` aria-sort="${state.sort.dir < 0 ? "descending" : "ascending"}"` : ""} title="OpenRAPM minus the consensus, per 1 standard deviation of the stat, points per 100">${name}</th>`;
    thead.innerHTML = `<tr><th class="name" data-reset>Stat</th>` + COLUMNS.map(([key, name]) => th(key, name)).join("") + `</tr>`;
    tbody.innerHTML = sorted.map(row => `<tr><td class="name">${esc(row.label)}</td>` +
      COLUMNS.map(([key]) => cell(row[key], row[key + "_se"])).join("") + `</tr>`).join("");
    const errors = COLUMNS.map(([key]) => rows.map(row => row[key + "_se"]).filter(v => v !== null));
    tfoot.innerHTML = `<tr><td class="name">Median standard error</td>` +
      errors.map(values => `<td>${values.length ? plain(median(values)) : "—"}</td>`).join("") + `</tr>`;
  }

  function systems() {
    const t = $("systems");
    t.querySelector("thead").innerHTML = `<tr><th class="name">Consensus</th><th class="name">By</th><th title="Share of the consensus">Weight</th><th title="Date the ratings were pulled">As of</th></tr>`;
    t.querySelector("tbody").innerHTML = data.systems.map(s =>
      `<tr><td class="name"><a href="${esc(s.link)}">${esc(s.name)}</a></td><td class="name">${esc(s.by)}</td>` +
      `<td>${Math.round(s.weight * 100)}%</td><td>${day(s.as_of)}</td></tr>`).join("");
  }

  thead.addEventListener("click", e => {
    const th = e.target.closest("th");
    if (!th) return;
    const key = th.dataset.k;
    state.sort = !key ? null : state.sort && state.sort.k === key ? { k: key, dir: -state.sort.dir } : { k: key, dir: -1 };
    render();
  });

  // the table as a file: every number the page holds, the standard errors and each stat's standard deviation included
  $("csv").addEventListener("click", e => {
    e.preventDefault();
    if (!data) return;
    const q = v => v === null ? "" : /[",\r\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
    const head = ["stat", "label", "total", "total_se", "stat_sd"];
    const lines = [head, ...rows.map(r => [r.stat, r.label, r.t, r.t_se, r.sd])];
    const text = "﻿" + lines.map(line => line.map(q).join(",")).join("\r\n") + "\r\n";
    const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: `openrapm_bias_${data.meta.season}.csv` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  fetch("data/bias.json").then(r => r.json()).then(doc => {
    data = doc;
    rows = doc.rows.map(values => Object.fromEntries(doc.meta.fields.map((field, i) => [field, values[i]])));
    $("byline").textContent = `${doc.meta.season} · ${doc.meta.players} of ${doc.meta.players_shown} players · through ${day(doc.meta.through)}`;
    render();
    systems();
  }).catch(() => { tbody.innerHTML = `<tr><td class="msg" colspan="99">Could not load the bias table.</td></tr>`; });
})();
</script>
</body>
</html>
