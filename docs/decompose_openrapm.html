<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenRAPM</title>
<!-- the detail view lives on the ratings page; an old link keeps its season, side and player -->
<script>
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    h.delete("min");
    h.set("view", "detail");
    location.replace("./#" + h.toString());
  })();
</script>
<meta http-equiv="refresh" content="0; url=./#view=detail">
</head>
<body><p><a href="./#view=detail">OpenRAPM detail</a></p></body>
</html>
