<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRAPM: similarity</title>
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<style>
  :root { --line: #d9d8d3; --muted: #6b6a66; --ink: #1a1a19; --accent: #2a78d6; --pick: #eef4fc; }
  :root[data-theme="dark"] { --line: #3a3a38; --muted: #a09f98; --ink: #f2f1ee; --accent: #3987e5; --pick: #1f2a38; }
  body { color: var(--ink); font: 15px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1 { font-size: 26px; margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 14px; }
  label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  select, input { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px;
                  background: transparent; color: inherit; }
  select option { background: Canvas; color: CanvasText; }
  input[type=search] { width: 150px; } #player { max-width: 230px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; padding: 5px 12px; border: 0; background: transparent;
                color: var(--muted); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 16px; }
  .dl { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .dl a { color: inherit; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
  th.rank, td.rank { color: var(--muted); cursor: default; }
  th.name, td.name { text-align: left; position: sticky; left: 0; background: Canvas; cursor: default; }
  th.season { cursor: default; }
  th[aria-sort="descending"], th[aria-sort="ascending"] { color: var(--accent); }
  th[aria-sort="descending"]::after { content: " \2193"; }
  th[aria-sort="ascending"]::after { content: " \2191"; }
  tr.pick td { background: var(--pick); font-weight: 700; }
  tr.match { cursor: pointer; }
  tr.match:hover td.name, tr.match:focus-visible td.name { color: var(--accent); }
  tr.match:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<main>
  <nav class="site">
    <a href="./">Ratings</a>
    <a href="decompose.html">Decomposition</a>
    <a href="bias.html">Bias</a>
    <a href="similarity.html" aria-current="page">Similarity</a>
    <button class="theme" type="button" aria-label="Dark mode" title="Dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
  </nav>
  <h1>Similarity</h1>
  <div class="controls">
    <label>Find <input id="find" type="search" placeholder="player name" autocomplete="off"></label>
    <label>Player <select id="player"></select></label>
    <label>Season <select id="season"></select></label>
    <div class="seg" role="group" aria-label="List">
      <button type="button" data-list="seasons" aria-pressed="true">Seasons</button>
      <button type="button" data-list="players" aria-pressed="false">Players</button>
    </div>
  </div>
  <div class="meta">
    <p class="count" id="count">Loading&hellip;</p>
    <p class="dl">Download CSV: <a href="#" id="csv-view">this view</a></p>
  </div>
  <div class="scroll">
    <table id="table">
      <thead><tr>
        <th class="rank">#</th><th class="name">Player</th><th class="season">Season</th>
        <th data-k="dist" aria-sort="ascending" title="sort">Distance</th>
        <th data-k="o" aria-sort="none" title="sort">Offense</th>
        <th data-k="d" aria-sort="none" title="sort">Defense</th>
        <th data-k="t" aria-sort="none" title="sort">Total</th>
        <th data-k="p" aria-sort="none" title="sort">Poss.</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const fmt = v => (v > 0 ? "+" : "") + v.toFixed(1);
  const find = $("find"), playerSelect = $("player"), seasonSelect = $("season"), tbody = $("table").querySelector("tbody");
  // nearest first; any other column starts high to low, and a second click on the same column flips it
  const state = { id: null, season: null, list: "seasons", sortKey: "dist", sortDir: 1 };
  const files = {};
  let pool = [], meta = null, at = new Map(), players = [], seasonsOf = new Map(), shown = [];

  // player_seasons.json: the pool in its order (season, then id); a row's position is how the season files name it
  async function loadPool() {
    const doc = await (await fetch("data/similarity/player_seasons.json")).json();
    meta = doc.meta;
    pool = doc.rows.map((r, i) => Object.assign(Object.fromEntries(meta.fields.map((f, j) => [f, r[j]])), { i }));
    pool.forEach(r => {
      at.set(r.id + ":" + r.s, r.i);
      if (!seasonsOf.has(r.id)) seasonsOf.set(r.id, []);
      seasonsOf.get(r.id).push(r.s);
    });
    // one entry per player, by name; a name two players share carries each one's first and last season
    const latest = new Map(pool.map(r => [r.id, r.n]));
    const named = [...latest].map(([id, n]) => ({ id, n }));
    const count = new Map();
    named.forEach(p => count.set(p.n, (count.get(p.n) || 0) + 1));
    players = named.map(p => {
      const s = seasonsOf.get(p.id);
      return { id: p.id, label: count.get(p.n) > 1 ? `${p.n} (${s[0]}-${s[s.length - 1]})` : p.n };
    }).sort((a, b) => a.label.localeCompare(b.label));
  }

  async function seasonFile(season) {
    if (!files[season]) files[season] = await (await fetch(`data/similarity/${season}.json`)).json();
    return files[season];
  }

  const option = (value, text) => { const o = document.createElement("option"); o.value = value; o.textContent = text; return o; };
  function fillPlayers() {
    const q = fold(find.value.trim());
    const list = q ? players.filter(p => fold(p.label).includes(q)) : players;
    const opts = list.map(p => option(p.id, p.label));
    const here = list.some(p => p.id === state.id);
    if (!here) opts.unshift(option("", "—"));
    playerSelect.replaceChildren(...opts);
    playerSelect.value = here ? String(state.id) : "";
  }
  function fillSeasons() {
    seasonSelect.replaceChildren(...[...seasonsOf.get(state.id)].reverse().map(s => option(s, s)));
    seasonSelect.value = String(state.season);
  }

  function readAddress() {
    const h = new URLSearchParams(location.hash.slice(1));
    const id = +h.get("player"), season = +h.get("season");
    [state.id, state.season] = at.has(id + ":" + season) ? [id, season] : meta.default;
    state.list = h.get("view") === "players" ? "players" : "seasons";
  }
  function writeAddress(push) {
    const h = new URLSearchParams({ player: state.id, season: state.season });
    if (state.list === "players") h.set("view", "players");
    history[push ? "pushState" : "replaceState"](null, "", "#" + h.toString());
  }

  function cell(tr, text, cls) {
    const td = document.createElement("td");
    td.textContent = text;
    if (cls) td.className = cls;
    tr.appendChild(td);
  }
  function row(r, rank, distance, pick) {
    const tr = document.createElement("tr");
    tr.className = pick ? "pick" : "match";
    cell(tr, rank, "rank"); cell(tr, r.n, "name"); cell(tr, r.s, "");
    cell(tr, distance, ""); cell(tr, fmt(r.o), ""); cell(tr, fmt(r.d), ""); cell(tr, fmt(r.t), "");
    cell(tr, r.p.toLocaleString(), "");
    if (!pick) {
      tr.tabIndex = 0;
      const go = () => pick_(r.id, r.s);
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    }
    return tr;
  }

  async function render() {
    const i = at.get(state.id + ":" + state.season), doc = await seasonFile(state.season);
    if (i !== at.get(state.id + ":" + state.season)) return;      // a newer pick arrived while this file loaded
    const [k, d, pk, pd] = doc.rows[i - doc.meta.first];
    const [index, near] = state.list === "players" ? [pk, pd] : [k, d];
    let rows = index.map((j, n) => Object.assign({}, pool[j], { rank: n + 1, dist: near[n] }));
    rows.sort((a, b) => (a[state.sortKey] - b[state.sortKey]) * state.sortDir || a.rank - b.rank);
    shown = rows;
    tbody.replaceChildren(row(pool[i], "", "", true), ...rows.map(r => row(r, r.rank, r.dist.toFixed(2), false)));
    document.querySelectorAll("[data-list]").forEach(b => b.setAttribute("aria-pressed", b.dataset.list === state.list));
    $("count").textContent = rows.length + (state.list === "players" ? " players" : " player-seasons");
    fillPlayers();
    fillSeasons();
  }

  function pick_(id, season) {
    state.id = id; state.season = season;
    writeAddress(true);
    render();
    scrollTo({ top: 0 });
  }

  // the CSV carries the NBA player id, which the table leaves out; UTF-8 with a byte-order mark so a spreadsheet
  // opens names like Jokić as written
  function downloadCSV() {
    const q = v => { const s = String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ["rank", "player_id", "player", "season", "distance", "offense", "defense", "total", "possessions"];
    const body = shown.map(r => [r.rank, r.id, r.n, r.s, r.dist, r.o, r.d, r.t, r.p]);
    const text = "﻿" + [head, ...body].map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
    const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    const name = `openrapm_similarity_${state.id}_${state.season}_${state.list}.csv`;
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
    state.sortDir = state.sortKey === th.dataset.k ? -state.sortDir : th.dataset.k === "dist" ? 1 : -1;
    state.sortKey = th.dataset.k;
    const dir = state.sortDir < 0 ? "descending" : "ascending";
    document.querySelectorAll("th[data-k]").forEach(x => x.setAttribute("aria-sort", x === th ? dir : "none"));
    render();
  }));
  document.querySelectorAll("[data-list]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.list !== state.list) { state.list = b.dataset.list; writeAddress(false); render(); }
  }));
  find.addEventListener("input", fillPlayers);
  playerSelect.addEventListener("change", () => {
    if (playerSelect.value === "") return;
    const id = +playerSelect.value, seasons = seasonsOf.get(id);
    pick_(id, seasons[seasons.length - 1]);
  });
  seasonSelect.addEventListener("change", () => pick_(state.id, +seasonSelect.value));
  $("csv-view").addEventListener("click", e => { e.preventDefault(); downloadCSV(); });
  addEventListener("popstate", () => { readAddress(); render(); });

  loadPool().then(() => { readAddress(); writeAddress(false); return render(); })
            .catch(() => { $("count").textContent = "Could not load the data."; });
})();
</script>
</body>
</html>
