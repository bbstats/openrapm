<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRAPM: similarity</title>
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<style>
  :root { --line: #d9d8d3; --muted: #6b6a66; --ink: #1a1a19; --accent: #2a78d6; --pick: #eef4fc; }
  :root[data-theme="dark"] { --line: #3a3a38; --muted: #a09f98; --ink: #f2f1ee; --accent: #3987e5; --pick: #1f2a38; }
  body { color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .combo { position: relative; }
  #player { width: 250px; }
  #player-list { position: absolute; z-index: 10; top: 100%; left: 0; min-width: 100%; max-height: 360px;
                 overflow-y: auto; margin: 3px 0 0; padding: 4px 0; list-style: none; background: Canvas;
                 border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgb(0 0 0 / 0.14); }
  #player-list li { padding: 8px 12px; white-space: nowrap; cursor: pointer; }
  #player-list li[aria-selected="true"] { background: var(--accent); color: #fff; }
  .dl { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
  .dl a { color: inherit; }
  td.msg { text-align: left; color: var(--muted); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
  th:hover { color: var(--ink); }
  th.rank, td.rank { color: var(--muted); cursor: default; }
  th.name, td.name { text-align: left; position: sticky; left: 0; background: Canvas; cursor: default; }
  th.season { cursor: default; }
  /* every header keeps room for the sort arrow, so sorting never shifts the columns */
  th[data-k]::after { content: "\2193"; margin-left: 3px; visibility: hidden; }
  th[aria-sort="descending"]::after { visibility: visible; }
  th[aria-sort="ascending"]::after { content: "\2191"; visibility: visible; }
  th[aria-sort="descending"], th[aria-sort="ascending"] { color: var(--accent); }
  tr.pick td { background: var(--pick); font-weight: 700; }
  tr.match { cursor: pointer; }
  tr.match:hover td.name, tr.match:focus-visible td.name { color: var(--accent); }
  tr.match:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<main>
  <nav class="site">
    <a href="./">Ratings</a>
    <a href="power.html" hidden>Power</a>
    <a href="similarity.html" aria-current="page">~ Similarity</a>
    <a href="bias.html">Bias</a>
    <a href="about.html">About</a>
    <a href="changelog.html">Changelog</a>
    <button class="theme" type="button" aria-label="Dark mode" title="Dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
  </nav>
  <h1>Similarity</h1>
  <div class="controls">
    <div class="combo">
      <input id="player" type="text" role="combobox" aria-label="Player" aria-autocomplete="list" aria-expanded="false"
             aria-controls="player-list" placeholder="player name" autocomplete="off" spellcheck="false">
      <ul id="player-list" role="listbox" hidden></ul>
    </div>
    <span class="step"><button type="button" id="older" aria-label="Previous season" title="Previous season">&lsaquo;</button><select id="season" aria-label="Season"></select><button type="button" id="newer" aria-label="Next season" title="Next season">&rsaquo;</button></span>
    <div class="seg" role="group" aria-label="List">
      <button type="button" data-list="seasons" aria-pressed="true">Seasons</button>
      <button type="button" data-list="players" aria-pressed="false">Players</button>
    </div>
  </div>
  <div class="scroll">
    <table id="table">
      <thead><tr>
        <th class="rank">#</th><th class="name">Player</th><th class="season">Season</th>
        <th data-k="dist" aria-sort="ascending" title="sort">Distance</th>
        <th data-k="o" aria-sort="none" title="sort">Offense</th>
        <th data-k="d" aria-sort="none" title="sort">Defense</th>
        <th data-k="t" aria-sort="none" title="sort">Total</th>
        <th data-k="p" aria-sort="none" title="sort">Poss.</th>
      </tr></thead>
      <tbody><tr><td class="msg" colspan="8">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
  <p class="dl">Download CSV: <a href="#" id="csv-view">this view</a></p>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  // as on the ratings page: a true minus sign, and Math.round rather than toFixed, so -1.25 shows as -1.2
  const fmt = v => { const r = Math.round(v * 10) / 10 || 0; return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(1); };
  const playerInput = $("player"), playerList = $("player-list"), seasonSelect = $("season");
  const tbody = $("table").querySelector("tbody");
  // nearest first; any other column starts high to low, and a second click on the same column flips it
  const state = { id: null, season: null, list: "seasons", sortKey: "dist", sortDir: 1 };
  const files = {};
  let pool = [], meta = null, at = new Map(), players = [], seasonsOf = new Map(), shown = [];

  // player_seasons.json: the pool in its order (season, then id); a row's position is how the season files name it
  async function loadPool() {
    const doc = await (await fetch("data/similarity/player_seasons.json")).json();
    meta = doc.meta;
    pool = doc.rows.map((r, i) => Object.assign(Object.fromEntries(meta.fields.map((f, j) => [f, r[j]])), { i }));
    pool.forEach(r => {
      at.set(r.id + ":" + r.s, r.i);
      if (!seasonsOf.has(r.id)) seasonsOf.set(r.id, []);
      seasonsOf.get(r.id).push(r.s);
    });
    // one entry per player, by name; a name two players share carries each one's first and last season
    const latest = new Map(pool.map(r => [r.id, r.n]));
    const named = [...latest].map(([id, n]) => ({ id, n }));
    const count = new Map();
    named.forEach(p => count.set(p.n, (count.get(p.n) || 0) + 1));
    players = named.map(p => {
      const s = seasonsOf.get(p.id), label = count.get(p.n) > 1 ? `${p.n} (${s[0]}-${s[s.length - 1]})` : p.n;
      return { id: p.id, label, key: fold(label) };
    }).sort((a, b) => a.label.localeCompare(b.label));
  }

  async function seasonFile(season) {
    if (!files[season]) files[season] = await (await fetch(`data/similarity/${season}.json`)).json();
    return files[season];
  }

  const option = (value, text) => { const o = document.createElement("option"); o.value = value; o.textContent = text; return o; };

  // the player box: typing lists the matching players under it, names that start with the text first, then names
  // with a word that does, then names that contain it; accents ignored, so "jokic" finds Jokić
  const MATCHES = 12;
  let offered = [], active = -1;
  function matching(text) {
    const q = fold(text.trim());
    if (!q) return [];
    const starts = [], words = [], inside = [];
    for (const p of players) {
      if (p.key.startsWith(q)) starts.push(p);
      else if (p.key.includes(" " + q)) words.push(p);
      else if (p.key.includes(q)) inside.push(p);
    }
    return [...starts, ...words, ...inside].slice(0, MATCHES);
  }
  function highlight(n) {
    active = n;
    [...playerList.children].forEach((li, j) => li.setAttribute("aria-selected", j === n));
    if (n >= 0) {
      playerInput.setAttribute("aria-activedescendant", playerList.children[n].id);
      playerList.children[n].scrollIntoView({ block: "nearest" });
    } else playerInput.removeAttribute("aria-activedescendant");
  }
  function offer(list) {
    offered = list;
    playerList.replaceChildren(...list.map((p, j) => {
      const li = document.createElement("li");
      li.id = "player-option-" + j; li.setAttribute("role", "option"); li.textContent = p.label;
      // mousedown, not click: picking must happen before the box loses focus and closes the list
      li.addEventListener("mousedown", e => { e.preventDefault(); choose(p); });
      return li;
    }));
    playerList.hidden = !list.length;
    playerInput.setAttribute("aria-expanded", list.length > 0);
    highlight(list.length ? 0 : -1);
  }
  const close = () => offer([]);
  const labelOf = id => (players.find(p => p.id === id) || { label: "" }).label;
  const showPick = () => { if (document.activeElement !== playerInput) playerInput.value = labelOf(state.id); };
  function choose(p) {
    close();
    playerInput.blur();
    const seasons = seasonsOf.get(p.id);
    pick_(p.id, seasons[seasons.length - 1]);
  }

  function fillSeasons() {
    const seasons = seasonsOf.get(state.id);         // his seasons, oldest first
    seasonSelect.replaceChildren(...[...seasons].reverse().map(s => option(s, s)));
    seasonSelect.value = String(state.season);
    $("older").disabled = state.season === seasons[0];
    $("newer").disabled = state.season === seasons[seasons.length - 1];
  }
  // the arrows step through his own seasons in place, like the list of seasons, so Back goes to the previous player
  // picked rather than through every season stepped past
  function step(by) {
    const seasons = seasonsOf.get(state.id), next = seasons[seasons.indexOf(state.season) + by];
    if (next !== undefined) pick_(state.id, next, false);
  }

  function readAddress() {
    const h = new URLSearchParams(location.hash.slice(1));
    const id = +h.get("player"), season = +h.get("season");
    [state.id, state.season] = at.has(id + ":" + season) ? [id, season] : meta.default;
    state.list = h.get("view") === "players" ? "players" : "seasons";
  }
  function writeAddress(push) {
    const h = new URLSearchParams({ player: state.id, season: state.season });
    if (state.list === "players") h.set("view", "players");
    history[push ? "pushState" : "replaceState"](null, "", "#" + h.toString());
  }

  function cell(tr, text, cls) {
    const td = document.createElement("td");
    td.textContent = text;
    if (cls) td.className = cls;
    tr.appendChild(td);
  }
  function row(r, rank, distance, pick) {
    const tr = document.createElement("tr");
    tr.className = pick ? "pick" : "match";
    cell(tr, rank, "rank"); cell(tr, r.n, "name"); cell(tr, r.s, "");
    cell(tr, distance, ""); cell(tr, fmt(r.o), ""); cell(tr, fmt(r.d), ""); cell(tr, fmt(r.t), "");
    cell(tr, r.p.toLocaleString("en-US"), "");
    if (!pick) {
      tr.tabIndex = 0;
      const go = () => pick_(r.id, r.s);
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    }
    return tr;
  }

  async function render() {
    const i = at.get(state.id + ":" + state.season), doc = await seasonFile(state.season);
    if (i !== at.get(state.id + ":" + state.season)) return;      // a newer pick arrived while this file loaded
    const [k, d, pk, pd] = doc.rows[i - doc.meta.first];
    const [index, near] = state.list === "players" ? [pk, pd] : [k, d];
    let rows = index.map((j, n) => Object.assign({}, pool[j], { rank: n + 1, dist: near[n] }));
    rows.sort((a, b) => (a[state.sortKey] - b[state.sortKey]) * state.sortDir || a.rank - b.rank);
    shown = rows;
    tbody.replaceChildren(row(pool[i], "", "", true), ...rows.map(r => row(r, r.rank, r.dist.toFixed(2), false)));
    document.querySelectorAll("[data-list]").forEach(b => b.setAttribute("aria-pressed", b.dataset.list === state.list));
    showPick();
    fillSeasons();
  }

  // a new pick adds a step to the history; a new season of the same player replaces the step it is on
  function pick_(id, season, push = true) {
    state.id = id; state.season = season;
    writeAddress(push);
    render();
    scrollTo({ top: 0 });
  }

  // the CSV carries the NBA player id, which the table leaves out; UTF-8 with a byte-order mark so a spreadsheet
  // opens names like Jokić as written
  function downloadCSV() {
    const q = v => { const s = String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ["rank", "player_id", "player", "season", "distance", "offense", "defense", "total", "possessions"];
    const body = shown.map(r => [r.rank, r.id, r.n, r.s, r.dist, r.o, r.d, r.t, r.p]);
    const text = "\ufeff" + [head, ...body].map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
    const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    const name = `openrapm_similarity_${state.id}_${state.season}_${state.list}.csv`;
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
    state.sortDir = state.sortKey === th.dataset.k ? -state.sortDir : th.dataset.k === "dist" ? 1 : -1;
    state.sortKey = th.dataset.k;
    const dir = state.sortDir < 0 ? "descending" : "ascending";
    document.querySelectorAll("th[data-k]").forEach(x => x.setAttribute("aria-sort", x === th ? dir : "none"));
    render();
  }));
  document.querySelectorAll("[data-list]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.list !== state.list) { state.list = b.dataset.list; writeAddress(false); render(); }
  }));
  playerInput.addEventListener("focus", () => playerInput.select());
  playerInput.addEventListener("input", () => offer(matching(playerInput.value)));
  playerInput.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" && playerList.hidden) { offer(matching(playerInput.value)); e.preventDefault(); return; }
    if (playerList.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      highlight((active + (e.key === "ArrowDown" ? 1 : offered.length - 1)) % offered.length);
      e.preventDefault();
    } else if (e.key === "Enter" && active >= 0) {
      e.preventDefault();
      choose(offered[active]);
    } else if (e.key === "Escape") {
      close();
      playerInput.value = labelOf(state.id);
    }
  });
  // leaving the box without picking puts the picked player's name back
  playerInput.addEventListener("blur", () => { close(); playerInput.value = labelOf(state.id); });
  seasonSelect.addEventListener("change", () => pick_(state.id, +seasonSelect.value, false));
  $("older").addEventListener("click", () => step(-1));
  $("newer").addEventListener("click", () => step(1));
  $("csv-view").addEventListener("click", e => { e.preventDefault(); downloadCSV(); });
  addEventListener("popstate", () => { readAddress(); render(); });

  loadPool().then(() => { readAddress(); writeAddress(false); return render(); })
            .catch(() => { tbody.innerHTML = `<tr><td class="msg" colspan="8">Could not load the data.</td></tr>`; });
})();
</script>
</body>
</html>
