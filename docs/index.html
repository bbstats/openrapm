<html lang="en">

<style>
  :root { --line: #d9d8d3; --muted: #6b6a66; --ink: #1a1a19; --accent: #2a78d6; --good: 34 165 90; --bad: 222 64 64; }
  :root[data-theme="dark"] { --line: #3a3a38; --muted: #a09f98; --ink: #f2f1ee; --accent: #3987e5;
                             --good: 52 190 110; --bad: 235 85 85; }
  /* the colors button: the pinwheel in gray while off, in color while on */
  nav.site .colors svg { filter: grayscale(1); opacity: 0.75; }
  nav.site .colors[aria-pressed="true"] svg { filter: none; opacity: 1; }
  nav.site .colors[aria-pressed="true"] { border-color: var(--muted); }
  body { color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #find { width: 210px; }
  /* the side buttons sit left of Detail, so the button stays under the pointer when they appear */
  .cols { display: inline-flex; gap: 8px; margin-left: auto; }
  .controls #pct, .controls #rookies { width: 40px; padding: 0; }
  .controls #rookies { font-size: 18px; }
  /* one link: the player's name and the cross that goes back to the list */
  .chip { display: inline-flex; align-items: center; gap: 12px; box-sizing: border-box; height: 40px;
          padding: 0 15px 0 17px; border: 1px solid var(--accent); border-radius: 999px; color: inherit;
          text-decoration: none; font-weight: 600; white-space: nowrap; }
  .chip .x { color: var(--muted); font-weight: 400; }
  h1.titled { margin-bottom: 2px; }
  .byline { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .byline a { color: var(--accent); }
  .chip:hover, .chip:focus-visible { background: rgb(128 128 128 / 0.1); }
  .chip:hover .x, .chip:focus-visible .x { color: var(--accent); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* as wide as its columns, not the page: each number column about 60 px, as rating sites lay theirs out; the name
     and team columns keep a set width so the table does not shift as Find or a team narrows the list */
  table { border-collapse: separate; border-spacing: 0; width: auto; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th[data-k]:not(.season) { min-width: 44px; }
  /* a set width, so more columns fit: a longer name is cut with an ellipsis and shown whole on hover */
  td.name { width: 150px; max-width: 150px; }
  td.name > a { overflow: hidden; text-overflow: ellipsis; }
  td.team { width: 72px; white-space: normal; }       /* two teams on a line; a third goes to the next */
  th { color: var(--muted); font-weight: 600; font-size: 13px; vertical-align: bottom; cursor: pointer;
       user-select: none; }
  th:hover { color: var(--ink); }
  th.rank, td.rank { color: var(--muted); cursor: default; }
  th.name, td.name, th.season, td.season { text-align: left; position: sticky; left: 0; background: Canvas; }
  th.name, th.team { cursor: default; }
  th.team, td.team { text-align: left; color: var(--muted); }
  /* every header keeps room for the sort arrow, so sorting never shifts the columns */
  th[data-k]::after { content: "\2193"; margin-left: 3px; visibility: hidden; }
  th[aria-sort="descending"]::after { visibility: visible; }
  th[aria-sort="ascending"]::after { content: "\2191"; visibility: visible; }
  th[aria-sort="descending"], th[aria-sort="ascending"] { color: var(--accent); }
  td.total { font-weight: 700; }
  /* in a player's seasons, the latest season: its season and team cells tinted orange, over Canvas since the season
     cell is sticky */
  tr.now td.season, tr.now td.team { background: linear-gradient(rgb(245 140 30 / 0.16) 0 0), Canvas; }
  td.msg { text-align: left; color: var(--muted); }
  td a { color: inherit; text-decoration: none; }
  td a:hover, td a:focus-visible { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  /* a name, or a lone team, is a link the size of its cell; two teams share theirs */
  td.name > a, td.team a:only-child { display: block; margin: -9px -8px; padding: 9px 8px; }
  /* each code of SAC/IND reaches the cell's edges and meets the slash, so its letters sit where a lone team's do */
  td.team a { display: inline-block; margin: -9px -2px; padding: 9px 2px; }
  td.team a:first-child { margin-left: -8px; padding-left: 8px; }
  td.team a:last-child { margin-right: -8px; padding-right: 8px; }
  td.name .tm { display: none; }
  /* a season's ~ opens the similarity page on that player-season */
  td.season a.sim { display: inline-block; margin: -9px -8px -9px 2px; padding: 9px 12px 9px 10px; color: var(--ink);
                    font-size: 17px; line-height: 1; font-weight: 900; }
  td.season a.sim:hover, td.season a.sim:focus-visible { color: var(--accent); text-decoration: none; }
  .dl { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
  .dl a { color: inherit; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12.5px; }
  footer a { color: inherit; }
  @media (max-width: 600px) {
    body { font-size: 13.5px; }
    /* the controls in full-width rows: season and team, then Find, then the buttons; the side buttons, when shown,
       take a row of their own above Detail and %ile */
    .controls { gap: 8px; }
    .controls [data-list] { flex: 1 1 auto; }
    .controls .step { flex: 0 0 auto; }
    #find { width: 100%; flex-basis: 100%; }
    .cols { width: 100%; flex-wrap: wrap; margin-left: 0; }
    .cols .seg { flex: 1 1 100%; }
    .cols .seg button { flex: 1; padding: 0 8px; }
    #pieces { flex: 1; }
    th, td { padding: 7px 5px; }
    th { padding-top: 11px; padding-bottom: 11px; }     /* a header is a 40 px target for a thumb */
    th[data-k]:not(.season) { min-width: 0; }
    table { font-size: 13px; }
    td.name { width: 110px; max-width: 110px; }          /* a long name is cut with an ellipsis, as on a desktop */
    /* the name's tap area reaches the top and the sides of its cell and the teams' its bottom; nothing moves */
    td.name > a { margin: -7px -5px 0; padding: 7px 5px 2px; }
    th.team, td.team { display: none; }                 /* the team goes under the name instead */
    td.name .tm { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
    td.name .tm a { display: inline-block; margin: -2px 0 -7px; padding: 2px 0 7px; }
    td.name .tm a:first-child { margin-left: -5px; padding-left: 5px; }
    table.career th.team, table.career td.team { display: table-cell; }   /* a player's seasons have no name cell */
  }
</style>
</head>
<body>
<main>
  <nav class="site">
    <a href="./" aria-current="page">Ratings</a>
    <a href="power.html" hidden>Power</a>

    <a href="about.html">About</a>
    <a href="changelog.html">Changelog</a>
    <button class="colors" id="colors" type="button" aria-pressed="false" aria-label="Colors" title="Colors"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 8V1.5A4.5 4.5 0 0 1 12.5 6z" fill="#e5484d"/><path d="M8 8V1.5A4.5 4.5 0 0 1 12.5 6z" fill="#f5b700" transform="rotate(90 8 8)"/><path d="M8 8V1.5A4.5 4.5 0 0 1 12.5 6z" fill="#2fa36b" transform="rotate(180 8 8)"/><path d="M8 8V1.5A4.5 4.5 0 0 1 12.5 6z" fill="#3987e5" transform="rotate(270 8 8)"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg></button>
    <button class="theme" type="button" aria-label="Dark mode" title="Dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
  </nav>
  <h1 class="titled">OpenRAPM</h1>
  <p class="byline">by <a href="http://twitter.com/bbstats">Nathan Walker</a><span id="through"></span></p>
  <div class="controls">
    <span class="step" data-list><button type="button" id="older" aria-label="Previous season" title="Previous season" disabled>&lsaquo;</button><select id="season" aria-label="Season"></select><button type="button" id="newer" aria-label="Next season" title="Next season" disabled>&rsaquo;</button></span>
    <select id="team" aria-label="Team" data-list></select>
    <input id="find" type="search" placeholder="Find player" aria-label="Find player" autocomplete="off" spellcheck="false" data-list>
    <a class="chip" id="chip" href="#" hidden><span id="chip-name"></span><span class="x" aria-hidden="true">&#x2715;</span></a>
    <span class="cols">
      <span class="seg" id="side" role="group" aria-label="Side" hidden><button type="button" data-side="off" aria-pressed="false">Offense</button><button type="button" data-side="def" aria-pressed="false">Defense</button><button type="button" data-side="total" aria-pressed="true">Total</button></span>
      <button type="button" id="pieces" aria-pressed="false">Detail</button>
      <button type="button" id="rookies" aria-pressed="false" title="Rookies" aria-label="Rookies">&#x265C;</button>
      <button type="button" id="pct" aria-pressed="false" title="Percentile among players with 500 or more possessions, fewer while a season is in progress">%ile</button>
    </span>
  </div>
  <div class="scroll">
    <table id="table"><thead></thead><tbody><tr><td class="msg" colspan="99">Loading&hellip;</td></tr></tbody></table>
  </div>
  <p class="dl">Download CSV: <a href="#" id="csv-view">this view</a> &middot; <a href="#" id="csv-all">all seasons</a></p>
  <footer><a href="https://github.com/bbstats/openrapm">github.com/bbstats/openrapm</a></footer>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  // a true minus sign, and Math.round rather than toFixed, so -1.25 shows as -1.2 on every page
  const sign = v => v > 0 ? "+" : v < 0 ? "−" : "";
  const fmt1 = v => { const r = Math.round(v * 10) / 10 || 0; return sign(r) + Math.abs(r).toFixed(1); };
  const fmt = v => sign(v) + Math.abs(v).toFixed(2);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const whole = new Intl.NumberFormat("en-US");      // one formatter: toLocaleString builds a new one every call
  // a name as Find compares it: no accents, no capitals, no apostrophes or periods, a hyphen read as a space, and no
  // space at either end, so "jokic ", "gilgeous alexander", "DAngelo" and "pj tucker" each find their player
  const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/['\u2018\u2019.]/g, "").replace(/[-\s]+/g, " ").trim();
  const option = (value, text) => Object.assign(document.createElement("option"), { value, textContent: text });

  // the data file's three sides; each holds the five pieces and the rating, in the order PIECES lists them
  const SIDE_FIELD = { off: "o", def: "d", total: "t" };
  const FIELD_SIDE = { o: "off", d: "def", t: "total" };
  const PIECES = [["box", "Box score"], ["adj", "Box Adj"], ["on", "On adj"], ["off", "Off adj"], ["sos", "SOS Adj"]];
  // the side's leverage and WOSA (meta.wosa_parts; src/openrapm/wins.py says how they multiply).  The owner,
  // 2026-11-07: Minutes and vs starter avg off the page, Leverage kept
  const WOSA_SIDE = { off: "wo", def: "wd", total: "wt" };
  const WOSA_COLS = [["wl", "Leverage"], ["ws", "WOSA"]];
  // the columns of each view, [key, header]: the ratings view shows each side's rating, the detail one
  // side's pieces and its WOSA's inputs
  const COLUMNS = { ratings: [["o", "Offense"], ["d", "Defense"], ["t", "Total"], ["w", "WOSA"], ["p", "Poss."]],
                    detail: [...PIECES, ["a", "OpenRAPM"], ["p", "Poss."], ...WOSA_COLS] };
  // each column header's hover text
  const TIPS = { o: "Points per 100 possessions added on offense, vs. an average player",
                 d: "Points per 100 possessions saved on defense, vs. an average player",
                 t: "Offense plus defense, points per 100 possessions",
                 w: "Wins over starter average: wins added over the average of the 150 most-started players, regular season only",
                 p: "Offensive possessions played, regular season and playoffs",
                 box: "Rating predicted from the box score alone",
                 adj: "Single-season box score adjustment",
                 on: "Adjustment from the player's own possessions on court",
                 off: "Adjustment from the team's possessions without the player",
                 sos: "Adjustment from other teams' games: strength of schedule",
                 a: "The full rating: the five columns before it, summed",
                 wl: "How much his possessions could swing games: 1 is an average possession, above 1 is more time in close games",
                 ws: "Wins over starter average: wins added over the average of the 150 most-started players, regular season only" };

  // the season list and a player's seasons keep a sort each, so the way back finds the list sorted as it was
  const state = { view: "ratings", side: "total", season: null, team: "", q: "", player: null,
                  sort: { list: { k: "t", dir: -1 }, player: { k: "s", dir: 1 } } };
  const sorting = () => state.sort[state.player === null ? "list" : "player"];
  const table = $("table"), thead = table.querySelector("thead"), tbody = table.querySelector("tbody");
  const season = $("season"), team = $("team"), find = $("find"), chip = $("chip"), pieces = $("pieces");
  let data = null, careers = new Map(), shown = [];
  // on a phone the team column is hidden and each team goes under the name instead; drawn only there, so a redraw on
  // a wider screen writes less
  const phone = matchMedia("(max-width: 600px)");
  phone.addEventListener("change", () => { if (data) render(); });
  // the similarity page's player-seasons, "id:season": a season's ~ shows only where that page has it (1,000 or more
  // offensive possessions, Finals over).  Only a player's own seasons show the ~, so the file is asked for the first
  // time one is drawn, and never holds up a table; without it the seasons go without their ~
  let similar = new Set(), similarAsked = false;
  function askSimilar() {
    if (similarAsked) return;
    similarAsked = true;
    fetch("data/similarity/player_seasons.json").then(r => r.json()).then(pool => {
      const f = pool.meta.fields, id = f.indexOf("id"), s = f.indexOf("s");
      similar = new Set(pool.rows.map(r => r[id] + ":" + r[s]));
      if (state.player !== null) render();
    }, () => {});
  }
  // a date as the Power and Bias pages write it: Nov 8, 2026
  const day = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

  // Two files, each with its rows by season under the fields its meta names.  The list file, ratings_list.json, holds
  // what the page first draws: each player-season's team, three ratings, WOSA and possessions, a third of the Detail
  // file's megabyte.  The Detail file, decompose_openrapm.json, adds each side's pieces and WOSA inputs, and is
  // fetched the first time Detail is shown, or as the pointer reaches its button
  const rowsOf = doc => {
    const f = doc.meta.fields, rows = {};
    for (const [k, list] of Object.entries(doc.rows))
      rows[k] = list.map(r => Object.fromEntries(f.map((name, j) => [name, r[j]])));
    return rows;
  };
  async function load() {
    const doc = await (await fetch("data/ratings_list.json")).json();
    return { meta: doc.meta, rows: rowsOf(doc) };
  }
  // a Detail row keeps the list row's shape, o, d and t its three ratings, with the file's own arrays under x
  let detailed = null;                                // the Detail file's promise, once it has been asked for
  function loadDetail() {
    if (!detailed) detailed = fetch("data/decompose_openrapm.json").then(r => r.json()).then(doc => {
      const rows = rowsOf(doc);
      for (const list of Object.values(rows)) for (const r of list) {
        r.x = { o: r.o, d: r.d, t: r.t, wo: r.wo, wd: r.wd, wt: r.wt };
        r.o = r.x.o[5]; r.d = r.x.d[5]; r.t = r.x.t[5];
      }
      data = { meta: Object.assign({}, doc.meta, data.meta), rows, detail: true };
      careers = careersOf(data);
      poolCache.clear(); pctCache.clear();
    }).catch(e => { detailed = null; throw e; });
    return detailed;
  }
  // each player's seasons as [season, row], latest first, so the first carries his latest name; meta.seasons runs
  // latest first, the rows' keys would not
  function careersOf(d) {
    const m = new Map();
    for (const s of d.meta.seasons.map(String)) for (const x of d.rows[s]) {
      if (!m.has(x.id)) m.set(x.id, []);
      m.get(x.id).push([s, x]);
    }
    return m;
  }

  // one player's row as the table reads it: each side's rating, and the chosen side's five pieces and rating
  function onSide(r, side) {
    const row = { n: r.n, id: r.id, p: r.p, tm: r.tm, w: r.w, o: r.o, d: r.d, t: r.t, rt: r.t };
    if (!r.x) return row;                             // a row of the list file: the ratings alone
    const v = r.x[SIDE_FIELD[side]], x = r.x[WOSA_SIDE[side]];
    return Object.assign(row, { box: v[0], adj: v[4], on: v[1], off: v[2], sos: v[3], a: v[5], wl: x[1], ws: x[2] });
  }

  // the percentile button: each number becomes its percentile among the season's players with 500 or more
  // possessions, or in a season in progress 500 times the share of the season played, never under the 60 shown
  // (meta.percentile_min, written by openrapm site); a player under the pool's minimum gets none.  Remembered like
  // the theme
  const LIST_KEYS = ["o", "d", "t", "w"];               // the list file's numbers; the Detail file's rows have them all
  const ALL_KEYS = [...LIST_KEYS, "box", "adj", "on", "off", "sos", "a", "wl", "ws"];
  const pctKeys = () => data.detail ? ALL_KEYS : LIST_KEYS;
  const poolMin = season => (data.meta.percentile_min || {})[season] || 500;
  try { state.pct = localStorage.getItem("percentile") === "1"; } catch (e) {}
  // the rookies button: the season list shows only that season's rookies (meta.rookies, written by openrapm site).
  // Remembered like the percentile button; a player's own seasons have nothing to filter, so it is not shown there
  try { state.rookies = localStorage.getItem("rookies") === "1"; } catch (e) {}
  const rookieSets = new Map();                       // season -> the ids of its rookies
  function rookiesOf(season) {
    if (!rookieSets.has(season)) rookieSets.set(season, new Set((data.meta.rookies || {})[season] || []));
    return rookieSets.get(season);
  }
  // the colors button: each rating cell shaded by where its number falls among the same pool the percentiles use,
  // green at the top, none at the middle, red at the bottom.  A player under the pool's minimum is shaded by where
  // his number would fall in it.  Remembered like the theme
  try { state.colors = localStorage.getItem("colors") === "1"; } catch (e) {}
  const poolCache = new Map();                        // "season:side" -> key -> the pool's numbers, low to high
  function poolOf(season, side) {
    const key = season + ":" + side;
    if (!poolCache.has(key)) {
      const pool = data.rows[season].filter(r => r.p >= poolMin(season)).map(r => onSide(r, side)), out = {};
      for (const k of pctKeys()) out[k] = pool.map(r => r[k]).sort((a, b) => a - b);
      poolCache.set(key, out);
    }
    return poolCache.get(key);
  }
  // the share of the pool below v, ties counted half
  function pctIn(vals, v) {
    const n = vals.length;
    if (!n) return null;
    let lo = 0, hi = n;
    while (lo < hi) { const m = (lo + hi) >> 1; if (vals[m] < v) lo = m + 1; else hi = m; }
    const below = lo;
    hi = n;
    while (lo < hi) { const m = (lo + hi) >> 1; if (vals[m] <= v) lo = m + 1; else hi = m; }
    return 100 * (below + (lo - below) / 2) / n;
  }
  const pctCache = new Map();                         // "season:side" -> id -> that player's percentiles
  function percentiles(season, side) {
    const key = season + ":" + side;
    if (pctCache.has(key)) return pctCache.get(key);
    const vals = poolOf(season, side), out = new Map();
    for (const r of data.rows[season].filter(r => r.p >= poolMin(season)).map(r => onSide(r, side)))
      out.set(r.id, Object.fromEntries(pctKeys().map(k => [k, pctIn(vals[k], r[k])])));
    pctCache.set(key, out);
    return out;
  }
  // a cell's shade from its percentile: clear at the 50th, strongest at the 0th and 100th
  const shade = q => q === null || q === undefined || q === 50 ? ""
    : ` style="background: rgb(var(${q > 50 ? "--good" : "--bad"}) / ${(0.6 * Math.abs(q - 50) / 50).toFixed(3)})"`;
  // a row as shown: the numbers, or their percentiles with null under the pool's minimum; with the colors on, each
  // number's percentile for its shade in c
  function shownRow(r, side, season) {
    const x = onSide(r, side);
    if (state.colors) { const vals = poolOf(season, side); x.c = {}; for (const k of pctKeys()) x.c[k] = pctIn(vals[k], x[k]); }
    if (!state.pct) return x;
    const q = percentiles(season, side).get(x.id);
    for (const k of pctKeys()) x[k] = q ? q[k] : null;
    return x;
  }
  // high to low or low to high, a missing percentile always last; ties go to the higher total
  const byKey = (k, dir) => (a, b) => (a[k] === null) - (b[k] === null) || (a[k] - b[k]) * dir || b.rt - a.rt;

  // an address: a place (season, team, player) and the two buttons as they are now, in the order old links have:
  // #season=2026&view=detail&side=off&team=SAS&player=1641705.  With a player, the season and team are the
  // list the cross goes back to.  The sort is not in it.  Built as a string: a redraw writes about 2,000 of them
  const addr = (season, team, player) => "#season=" + season +
    (state.view !== "ratings" ? "&view=" + state.view : "") + (state.side !== "total" ? "&side=" + state.side : "") +
    (team ? "&team=" + encodeURIComponent(team) : "") + (player !== null ? "&player=" + player : "");
  // every entry the page has drawn carries a state: that is how a hashchange tells Back and Forward (a state) from
  // a link or a typed address (none).  It also keeps the Find text, which the address leaves out
  // The page as it opens, the season the file names with every team and both buttons as they start, keeps a bare
  // address: with the season written into it, a bookmark of the home page went on opening that season after the
  // next one began
  const opening = () => state.player === null && !state.team && state.view === "ratings" && state.side === "total" &&
    state.season === String(data.meta.default_season || data.meta.seasons[0]);
  const writeAddress = () => history.replaceState(Object.assign({}, history.state, { q: state.q }), "",
    opening() ? location.pathname + location.search : addr(state.season, state.team, state.player));
  function place(h) {
    const seasons = data.meta.seasons.map(String), id = +h.get("player");
    // with no season in the address, the one meta names: a season in progress only once its median player shown has 250
    // offensive possessions (openrapm site, default_season)
    const opens = String(data.meta.default_season || seasons[0]);
    state.season = seasons.includes(h.get("season")) ? h.get("season") : seasons.includes(opens) ? opens : seasons[0];
    state.team = h.get("team") || "";
    state.player = careers.has(id) ? id : null;       // no id, a bad one or one without rows: the season list
    season.value = state.season;
    fillTeams();                                      // a team the season lacks becomes every team
  }
  // a link carries the buttons as they are, so only a typed or pasted address changes them
  function buttons(h) {
    // "decomposition" is the view's old name, which old links carry
    const view = h.get("view") === "detail" || h.get("view") === "decomposition" ? "detail" : "ratings",
          side = SIDE_FIELD[h.get("side")] ? h.get("side") : "total";
    if (view !== state.view || side !== state.side) setView(view, side);
  }
  // the two column sets share the sort where they can: a side's rating is that side's OpenRAPM column, and back;
  // both tables' sorts move.  Turning the pieces on takes the side from the rating the shown table is sorted on
  function setView(view, side = (view === "detail" && FIELD_SIDE[sorting().k]) || state.side) {
    for (const s of Object.values(state.sort))
      if (view === "ratings" ? s.k === "ws" : s.k === "w") s.k = view === "ratings" ? "w" : "ws";
      else if (view === "ratings" ? s.k !== "p" && s.k !== "s" : FIELD_SIDE[s.k]) s.k = view === "ratings" ? SIDE_FIELD[side] : "a";
    state.view = view;
    state.side = side;
  }

  function head() {
    const { k, dir } = sorting(), one = state.player !== null;
    // with the rating columns the side is the rating sorted on, so the bold column is the sorted one (sorted by
    // possessions or season it stays where it was)
    if (state.view === "ratings" && FIELD_SIDE[k]) state.side = FIELD_SIDE[k];
    const th = (key, name, cls) => `<th${cls ? ` class="${cls}"` : ""}${TIPS[key] ? ` title="${TIPS[key]}"` : ""} data-k="${key}" aria-sort="${key === k
      ? (dir < 0 ? "descending" : "ascending") : "none"}">${name}</th>`;
    thead.innerHTML = `<tr><th class="rank">#</th>` + (one ? th("s", "Season", "season") : `<th class="name">Player</th>`) +
      `<th class="team">Team</th>` + COLUMNS[state.view].map(([key, name]) => th(key, name)).join("") + `</tr>`;
    table.className = one ? "career" : "";
  }
  thead.addEventListener("click", e => {
    const th = e.target.closest("th[data-k]");
    if (!th) return;
    const s = sorting();
    // a new column starts high to low, Season oldest first
    s.dir = s.k === th.dataset.k ? -s.dir : th.dataset.k === "s" ? 1 : -1;
    s.k = th.dataset.k;
    render();
  });

  function render() {
    head();
    if (!data) return;
    const one = state.player !== null, detail = state.view === "detail", { k, dir } = sorting();
    if (detail && !data.detail) {                     // Detail's own file: asked for once, and the table waits for it
      tbody.innerHTML = `<tr><td class="msg" colspan="99">Loading&hellip;</td></tr>`;
      loadDetail().then(render, () => {
        tbody.innerHTML = `<tr><td class="msg" colspan="99">Could not load the data.</td></tr>`;
      });
      return;
    }
    if (one) askSimilar();
    // the day the season in progress runs through, beside the byline, on that season's list
    const through = !one && (data.meta.through || {})[state.season];
    $("through").textContent = through ? " · through " + day(through) : "";
    let rows;
    if (!one) {
      // every player of the season is ranked first and the team and name filters come after, so a player found
      // either way keeps his rank among all of them
      const q = fold(state.q);
      const all = data.rows[state.season].map(r => shownRow(r, state.side, state.season));
      all.sort(byKey(k, dir));
      all.forEach((r, i) => { r.rank = i + 1; });
      const rookieIds = rookiesOf(state.season);
      rows = all.filter(r => (!state.team || r.tm.split("/").includes(state.team)) && (!q || fold(r.n).includes(q)) &&
                             (!state.rookies || rookieIds.has(r.id)));
    } else {
      // his rank each season: that season sorted high to low on the sorted column (on the bold one when sorted by
      // season) with the list's tie-break; a stable sort numbers ties as the list does
      const rk = k === "s" ? (detail ? "a" : SIDE_FIELD[state.side]) : k;
      rows = careers.get(state.player).map(([s]) => {
        const them = data.rows[s].map(r => shownRow(r, state.side, s)).sort(byKey(rk, -1));
        const i = them.findIndex(r => r.id === state.player);
        return Object.assign(them[i], { rank: i + 1, s: +s });
      });
      rows.sort((a, b) => (a[k] === null) - (b[k] === null) || (a[k] - b[k]) * dir || b.s - a.s);
    }
    shown = rows;
    // a team code opens its season on that team; in the season list the chosen team's code clears it
    const teams = (tm, at) => tm.split("/").map(c =>
      `<a href="${esc(addr(at, one || c !== state.team ? c : "", null))}">${esc(c)}</a>`).join("/");
    const cols = COLUMNS[state.view], bold = detail ? ["a", "ws"] : [SIDE_FIELD[state.side]];
    const latest = String(data.meta.seasons[0]);      // a player's latest-season row is marked: meta.seasons runs latest first
    // a detail cell as written: leverage without a sign, the rest signed at two decimals
    const detailCell = (key, v) => key === "wl" ? v.toFixed(2) : fmt(v);
    tbody.innerHTML = rows.map(p => {
      const links = teams(p.tm, one ? String(p.s) : state.season);
      const first = one ? `<td class="season">${p.s}${similar.has(p.id + ":" + p.s) ? ` <a class="sim" href="similarity.html#player=${p.id}&amp;season=${p.s}" title="Similarity" aria-label="Similarity, ${p.s}">~</a>` : ""}</td>`
        : `<td class="name"><a href="${esc(addr(state.season, state.team, p.id))}" title="${esc(p.n)}">${esc(p.n)}</a>` +
          (phone.matches ? `<span class="tm">${links}</span>` : "") + `</td>`;
      return `<tr${one && String(p.s) === latest ? ' class="now"' : ""}><td class="rank">${p.rank}</td>${first}<td class="team">${links}</td>` + cols.map(([key]) =>
        `<td${bold.includes(key) ? ' class="total"' : ""}${p.c ? shade(p.c[key]) : ""}>${key === "p" ? whole.format(p.p)
          : state.pct ? (p[key] === null ? "—" : Math.round(p[key]))
          : detail ? detailCell(key, p[key]) : fmt1(p[key])}</td>`).join("") + `</tr>`;
    }).join("");

    // the controls: the season list's, or the player's name with the cross back to the list
    document.querySelectorAll("[data-list]").forEach(e => { e.hidden = one; });
    chip.hidden = !one;
    if (one) {
      const name = careers.get(state.player)[0][1].n;
      $("chip-name").textContent = name;
      chip.href = addr(state.season, state.team, null);
      document.title = `${name} · OpenRAPM`;
    } else document.title = "OpenRAPM";
    const seasons = data.meta.seasons.map(String);
    $("older").disabled = state.season === seasons[seasons.length - 1];
    $("newer").disabled = state.season === seasons[0];
    $("side").hidden = !detail;
    pieces.setAttribute("aria-pressed", detail);
    $("pct").setAttribute("aria-pressed", !!state.pct);
    $("rookies").setAttribute("aria-pressed", !!state.rookies);
    $("colors").setAttribute("aria-pressed", !!state.colors);
    $("rookies").hidden = one;
    document.querySelectorAll("[data-side]").forEach(b => b.setAttribute("aria-pressed", b.dataset.side === state.side));
    writeAddress();
  }

  // the CSV: the ratings view gives each side's rating, the detail view every side's pieces; both carry
  // the NBA player id, which the table leaves out.  UTF-8 with a byte-order mark so a spreadsheet opens names like
  // Jokić as written
  const CSV_PIECES = ["box_score", "box_adj", "on_adj", "off_adj", "team_sos_adjustment", "openrapm"];
  const csvPieces = v => [v[0], v[4], v[1], v[2], v[3], v[5]];
  const CSV_WOSA = ["leverage", "wosa"];
  function downloadCSV(filename, pairs) {
    if (state.view === "detail" && !data.detail) return;      // Detail's file is still on its way
    const q = v => { if (v === null || v === undefined) return "";
                     const s = String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = state.view === "ratings"
      ? [["season", "player_id", "player", "team", "offense", "defense", "total", "wosa", "possessions"],
         ...pairs.map(([per, x]) => [per, x.id, x.n, x.tm, x.o, x.d, x.t, x.w, x.p])]
      : [["season", "player_id", "player", "team", "possessions",
          ...["offense", "defense", "total"].flatMap(s => CSV_PIECES.map(k => s + "_" + k)),
          ...["offense", "defense", "total"].flatMap(s => CSV_WOSA.map(k => s + "_" + k))],
         ...pairs.map(([per, { id, n, tm, p, x }]) => [per, id, n, tm, p, ...csvPieces(x.o), ...csvPieces(x.d),
                                                      ...csvPieces(x.t), ...x.wo.slice(1), ...x.wd.slice(1),
                                                      ...x.wt.slice(1)])];
    const text = "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
    const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const csvName = what => `openrapm_${state.view === "ratings" ? "ratings" : "detail"}_${what}.csv`;
  $("csv-view").addEventListener("click", e => {
    e.preventDefault();
    if (!data) return;
    // the rows on screen, in their order on screen: the sort, and the team, Find and rookies filters
    if (state.player !== null) {                      // his seasons
      const bySeason = new Map(careers.get(state.player));
      return downloadCSV(csvName("player_" + state.player), shown.map(r => [String(r.s), bySeason.get(String(r.s))]));
    }
    const byId = new Map(data.rows[state.season].map(x => [x.id, x]));
    downloadCSV(csvName(state.season), shown.map(r => [state.season, byId.get(r.id)]));
  });
  $("csv-all").addEventListener("click", e => {
    e.preventDefault();
    if (!data) return;
    downloadCSV(csvName("all_seasons"), [...data.meta.seasons].reverse().flatMap(per => data.rows[per].map(x => [per, x])));
  });

  // the season's teams, as its box scores abbreviate them; a team the new season lacks goes back to every team
  function fillTeams() {
    const codes = [...new Set(data.rows[state.season].flatMap(r => r.tm.split("/")))].filter(Boolean).sort();
    if (!codes.includes(state.team)) state.team = "";
    team.replaceChildren(...["", ...codes].map(c => option(c, c || "All teams")));
    team.value = state.team;
  }
  // the season changes in place, from the list or the arrows, so Back skips the seasons stepped through
  function setSeason(s) { state.season = season.value = s; fillTeams(); render(); }
  function step(by) {                                 // meta.seasons runs latest first
    if (!data) return;                                // an arrow tapped while the page is still loading
    const seasons = data.meta.seasons.map(String), next = seasons[seasons.indexOf(state.season) + by];
    if (next !== undefined) setSeason(next);
  }
  season.addEventListener("change", () => setSeason(season.value));
  $("older").addEventListener("click", () => step(1));
  $("newer").addEventListener("click", () => step(-1));
  team.addEventListener("change", () => { state.team = team.value; render(); });
  find.addEventListener("input", () => { state.q = find.value; render(); });
  pieces.addEventListener("click", () => { setView(state.view === "ratings" ? "detail" : "ratings"); render(); });
  // Detail's file is on its way as the pointer or a finger reaches the button, so the click finds it in hand
  for (const reached of ["pointerenter", "focus"])
    pieces.addEventListener(reached, () => { if (data) loadDetail().catch(() => {}); });
  $("pct").addEventListener("click", () => {
    state.pct = !state.pct;
    try { localStorage.setItem("percentile", state.pct ? "1" : "0"); } catch (e) {}
    render();
  });
  $("colors").addEventListener("click", () => {
    state.colors = !state.colors;
    try { localStorage.setItem("colors", state.colors ? "1" : "0"); } catch (e) {}
    render();
  });
  $("rookies").addEventListener("click", () => {
    state.rookies = !state.rookies;
    try { localStorage.setItem("rookies", state.rookies ? "1" : "0"); } catch (e) {}
    render();
  });
  document.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.side !== state.side) { state.side = b.dataset.side; render(); }
  }));
  // the cross goes Back when this player was opened from a list in this tab; otherwise its link opens the list
  chip.addEventListener("click", e => { if (history.state && history.state.back) { e.preventDefault(); history.back(); } });
  // a link notes how far down its page was, so Back can return there; the click comes before the navigation, so
  // this still writes the entry being left
  history.scrollRestoration = "manual";               // the list is drawn after the browser would restore it
  document.addEventListener("click", e => {
    if (e.target.closest("a[href]")) history.replaceState(Object.assign({}, history.state, { y: scrollY }), "");
  });
  addEventListener("hashchange", () => {
    if (!data) return;                                // the first draw reads the address once the data is in
    const h = new URLSearchParams(location.hash.slice(1)), was = history.state, fromList = state.player === null;
    place(h);
    if (was) state.q = was.q || "";                   // Back or Forward: the place and its Find text, not the buttons
    else { buttons(h); if (state.player === null) state.q = ""; }      // a link to a list opens it unfiltered
    find.value = state.q;
    render();
    if (!was) history.replaceState(Object.assign({}, history.state, { back: fromList && state.player !== null }), "");
    scrollTo(0, (was && was.y) || 0);
  });

  const first = new URLSearchParams(location.hash.slice(1));
  buttons(first);
  state.player = +first.get("player") || null;        // so the header is right while the data loads
  head();
  load().then(d => {
    data = d;
    careers = careersOf(d);
    season.replaceChildren(...d.meta.seasons.map(s => option(String(s), String(s))));
    const now = new URLSearchParams(location.hash.slice(1));
    place(now);
    buttons(now);
    const saved = history.state || {};                // a reload keeps the Find text and where the page was
    state.q = find.value = saved.q || "";
    render();
    if (saved.y) scrollTo(0, saved.y);
  }).catch(() => { tbody.innerHTML = `<tr><td class="msg" colspan="99">Could not load the data.</td></tr>`; });
})();
</script>
</body>
</html>
