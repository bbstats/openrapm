<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRAPM</title>
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<style>
  :root { --line: #d9d8d3; --muted: #6b6a66; --ink: #1a1a19; --accent: #2a78d6; }
  :root[data-theme="dark"] { --line: #3a3a38; --muted: #a09f98; --ink: #f2f1ee; --accent: #3987e5; }
  body { color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #find { width: 210px; }
  /* the side buttons sit left of Decomposition, so the button stays under the pointer when they appear */
  .cols { display: inline-flex; gap: 8px; margin-left: auto; }
  /* one link: the player's name and the cross that goes back to the list */
  .chip { display: inline-flex; align-items: center; gap: 12px; box-sizing: border-box; height: 40px;
          padding: 0 15px 0 17px; border: 1px solid var(--accent); border-radius: 999px; color: inherit;
          text-decoration: none; font-weight: 600; white-space: nowrap; }
  .chip .x { color: var(--muted); font-weight: 400; }
  .chip:hover, .chip:focus-visible { background: rgb(128 128 128 / 0.1); }
  .chip:hover .x, .chip:focus-visible .x { color: var(--accent); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; vertical-align: bottom; cursor: pointer;
       user-select: none; }
  th:hover { color: var(--ink); }
  th.rank, td.rank { color: var(--muted); cursor: default; }
  th.name, td.name, th.season, td.season { text-align: left; position: sticky; left: 0; background: Canvas; }
  th.name, th.team { cursor: default; }
  th.team, td.team { text-align: left; color: var(--muted); }
  /* every header keeps room for the sort arrow, so sorting never shifts the columns */
  th[data-k]::after { content: "\2193"; margin-left: 3px; visibility: hidden; }
  th[aria-sort="descending"]::after { visibility: visible; }
  th[aria-sort="ascending"]::after { content: "\2191"; visibility: visible; }
  th[aria-sort="descending"], th[aria-sort="ascending"] { color: var(--accent); }
  td.total { font-weight: 700; }
  td.msg { text-align: left; color: var(--muted); }
  td a { color: inherit; text-decoration: none; }
  td a:hover, td a:focus-visible { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  /* a name, or a lone team, is a link the size of its cell; two teams share theirs */
  td.name > a, td.team a:only-child { display: block; margin: -9px -8px; padding: 9px 8px; }
  /* each code of SAC/IND reaches the cell's edges and meets the slash, so its letters sit where a lone team's do */
  td.team a { display: inline-block; margin: -9px -2px; padding: 9px 2px; }
  td.team a:first-child { margin-left: -8px; padding-left: 8px; }
  td.team a:last-child { margin-right: -8px; padding-right: 8px; }
  td.name .tm { display: none; }
  /* a season's ~ opens the similarity page on that player-season */
  td.season a.sim { display: inline-block; margin: -9px -8px -9px 2px; padding: 9px 12px 9px 10px; color: var(--ink);
                    font-size: 17px; line-height: 1; font-weight: 900; }
  td.season a.sim:hover, td.season a.sim:focus-visible { color: var(--accent); text-decoration: none; }
  .dl { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
  .dl a { color: inherit; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12.5px; }
  footer a { color: inherit; }
  @media (max-width: 600px) {
    body { font-size: 13.5px; }
    #find { width: 150px; }
    th, td { padding: 7px 5px; }
    table { font-size: 13px; }
    td.name { white-space: normal; min-width: 96px; }   /* a long name takes two lines so every column fits */
    td.name > a { margin: 0; padding: 0; }
    th.team, td.team { display: none; }                 /* the team goes under the name instead */
    td.name .tm { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
    td.name .tm a { display: inline; margin: 0; padding: 0; }
    table.career th.team, table.career td.team { display: table-cell; }   /* a player's seasons have no name cell */
  }
</style>
</head>
<body>
<main>
  <nav class="site">
    <a href="./" aria-current="page">Ratings</a>
    <a href="similarity.html">~ Similarity</a>
    <a href="bias.html">Bias</a>
    <a href="about.html">About</a>
    <button class="theme" type="button" aria-label="Dark mode" title="Dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
  </nav>
  <h1>OpenRAPM</h1>
  <div class="controls">
    <span class="step" data-list><button type="button" id="older" aria-label="Previous season" title="Previous season">&lsaquo;</button><select id="season" aria-label="Season"></select><button type="button" id="newer" aria-label="Next season" title="Next season">&rsaquo;</button></span>
    <select id="team" aria-label="Team" data-list></select>
    <input id="find" type="search" placeholder="Find player" aria-label="Find player" autocomplete="off" spellcheck="false" data-list>
    <a class="chip" id="chip" href="#" hidden><span id="chip-name"></span><span class="x" aria-hidden="true">&#x2715;</span></a>
    <span class="cols">
      <span class="seg" id="side" role="group" aria-label="Side" hidden><button type="button" data-side="off" aria-pressed="false">Offense</button><button type="button" data-side="def" aria-pressed="false">Defense</button><button type="button" data-side="total" aria-pressed="true">Total</button></span>
      <button type="button" id="pieces" aria-pressed="false">Decomposition</button>
    </span>
  </div>
  <div class="scroll">
    <table id="table"><thead></thead><tbody><tr><td class="msg" colspan="99">Loading&hellip;</td></tr></tbody></table>
  </div>
  <p class="dl">Download CSV: <a href="#" id="csv-view">this view</a> &middot; <a href="#" id="csv-all">all seasons</a></p>
  <footer><a href="https://github.com/bbstats/openrapm">github.com/bbstats/openrapm</a></footer>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  // a true minus sign, and Math.round rather than toFixed, so -1.25 shows as -1.2 on every page
  const sign = v => v > 0 ? "+" : v < 0 ? "−" : "";
  const fmt1 = v => { const r = Math.round(v * 10) / 10 || 0; return sign(r) + Math.abs(r).toFixed(1); };
  const fmt = v => sign(v) + Math.abs(v).toFixed(2);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const whole = new Intl.NumberFormat("en-US");      // one formatter: toLocaleString builds a new one every call
  const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const option = (value, text) => Object.assign(document.createElement("option"), { value, textContent: text });

  // the data file's three sides; each holds the five pieces and the rating, in the order PIECES lists them
  const SIDE_FIELD = { off: "o", def: "d", total: "t" };
  const FIELD_SIDE = { o: "off", d: "def", t: "total" };
  const PIECES = [["box", "Box score"], ["on", "On court"], ["off", "Off court"], ["sos", "Team SOS"],
                  ["swap", "Swap adjustment"]];
  // the columns of each view, [key, header]: the ratings view shows each side's rating, the decomposition one
  // side's pieces
  const COLUMNS = { ratings: [["o", "Offense"], ["d", "Defense"], ["t", "Total"], ["p", "Poss."]],
                    decomposition: [...PIECES, ["a", "OpenRAPM"], ["p", "Poss."]] };

  // the season list and a player's seasons keep a sort each, so the way back finds the list sorted as it was
  const state = { view: "ratings", side: "total", season: null, team: "", q: "", player: null,
                  sort: { list: { k: "t", dir: -1 }, player: { k: "s", dir: -1 } } };
  const sorting = () => state.sort[state.player === null ? "list" : "player"];
  const table = $("table"), thead = table.querySelector("thead"), tbody = table.querySelector("tbody");
  const season = $("season"), team = $("team"), find = $("find"), chip = $("chip"), pieces = $("pieces");
  let data = null, careers = new Map(), shown = [];
  // on a phone the team column is hidden and each team goes under the name instead; drawn only there, so a redraw on
  // a wider screen writes less
  const phone = matchMedia("(max-width: 600px)");
  phone.addEventListener("change", () => { if (data) render(); });
  // the similarity page's player-seasons, "id:season": a season's ~ shows only where that page has it (1,000 or more
  // offensive possessions, Finals over); read after the ratings, so it never holds up the table
  let similar = new Set();

  async function load() {
    const doc = await (await fetch("data/decompose_openrapm.json")).json();
    const f = doc.meta.fields, rows = {};
    for (const [k, list] of Object.entries(doc.rows))
      rows[k] = list.map(r => Object.fromEntries(f.map((name, j) => [name, r[j]])));
    return { meta: doc.meta, rows };
  }
  // each player's seasons as [season, row], latest first, so the first carries his latest name; meta.seasons runs
  // latest first, the rows' keys would not
  function careersOf(d) {
    const m = new Map();
    for (const s of d.meta.seasons.map(String)) for (const x of d.rows[s]) {
      if (!m.has(x.id)) m.set(x.id, []);
      m.get(x.id).push([s, x]);
    }
    return m;
  }

  // one player's row as the table reads it: each side's rating, and the chosen side's five pieces and rating
  function onSide(r, side) {
    const v = r[SIDE_FIELD[side]];
    return { n: r.n, id: r.id, p: r.p, tm: r.tm, o: r.o[5], d: r.d[5], t: r.t[5],
             box: v[0], on: v[1], off: v[2], sos: v[3], swap: v[4], a: v[5] };
  }

  // an address: a place (season, team, player) and the two buttons as they are now, in the order old links have:
  // #season=2026&view=decomposition&side=off&team=SAS&player=1641705.  With a player, the season and team are the
  // list the cross goes back to.  The sort is not in it.  Built as a string: a redraw writes about 2,000 of them
  const addr = (season, team, player) => "#season=" + season +
    (state.view !== "ratings" ? "&view=" + state.view : "") + (state.side !== "total" ? "&side=" + state.side : "") +
    (team ? "&team=" + encodeURIComponent(team) : "") + (player !== null ? "&player=" + player : "");
  // every entry the page has drawn carries a state: that is how a hashchange tells Back and Forward (a state) from
  // a link or a typed address (none).  It also keeps the Find text, which the address leaves out
  const writeAddress = () => history.replaceState(Object.assign({}, history.state, { q: state.q }), "",
                                                  addr(state.season, state.team, state.player));
  function place(h) {
    const seasons = data.meta.seasons.map(String), id = +h.get("player");
    state.season = seasons.includes(h.get("season")) ? h.get("season") : seasons[0];
    state.team = h.get("team") || "";
    state.player = careers.has(id) ? id : null;       // no id, a bad one or one without rows: the season list
    season.value = state.season;
    fillTeams();                                      // a team the season lacks becomes every team
  }
  // a link carries the buttons as they are, so only a typed or pasted address changes them
  function buttons(h) {
    const view = h.get("view") === "decomposition" ? "decomposition" : "ratings",
          side = SIDE_FIELD[h.get("side")] ? h.get("side") : "total";
    if (view !== state.view || side !== state.side) setView(view, side);
  }
  // the two column sets share the sort where they can: a side's rating is that side's OpenRAPM column, and back;
  // both tables' sorts move.  Turning the pieces on takes the side from the rating the shown table is sorted on
  function setView(view, side = (view === "decomposition" && FIELD_SIDE[sorting().k]) || state.side) {
    for (const s of Object.values(state.sort))
      if (view === "ratings" ? s.k !== "p" && s.k !== "s" : FIELD_SIDE[s.k]) s.k = view === "ratings" ? SIDE_FIELD[side] : "a";
    state.view = view;
    state.side = side;
  }

  function head() {
    const { k, dir } = sorting(), one = state.player !== null;
    // with the rating columns the side is the rating sorted on, so the bold column is the sorted one (sorted by
    // possessions or season it stays where it was)
    if (state.view === "ratings" && FIELD_SIDE[k]) state.side = FIELD_SIDE[k];
    const th = (key, name, cls) => `<th${cls ? ` class="${cls}"` : ""} data-k="${key}" aria-sort="${key === k
      ? (dir < 0 ? "descending" : "ascending") : "none"}">${name}</th>`;
    thead.innerHTML = `<tr><th class="rank">#</th>` + (one ? th("s", "Season", "season") : `<th class="name">Player</th>`) +
      `<th class="team">Team</th>` + COLUMNS[state.view].map(([key, name]) => th(key, name)).join("") + `</tr>`;
    table.className = one ? "career" : "";
  }
  thead.addEventListener("click", e => {
    const th = e.target.closest("th[data-k]");
    if (!th) return;
    const s = sorting();
    s.dir = s.k === th.dataset.k ? -s.dir : -1;       // a new column starts high to low, Season newest first
    s.k = th.dataset.k;
    render();
  });

  function render() {
    head();
    if (!data) return;
    const one = state.player !== null, decomposition = state.view === "decomposition", { k, dir } = sorting();
    let rows;
    if (!one) {
      // every player of the season is ranked first and the team and name filters come after, so a player found
      // either way keeps his rank among all of them
      const q = fold(state.q);
      const all = data.rows[state.season].map(r => onSide(r, state.side));
      all.sort((a, b) => (a[k] - b[k]) * dir || b.t - a.t);
      all.forEach((r, i) => { r.rank = i + 1; });
      rows = all.filter(r => (!state.team || r.tm.split("/").includes(state.team)) && (!q || fold(r.n).includes(q)));
    } else {
      // his rank each season: that season sorted high to low on the sorted column (on the bold one when sorted by
      // season) with the list's tie-break; a stable sort numbers ties as the list does
      const rk = k === "s" ? (decomposition ? "a" : SIDE_FIELD[state.side]) : k;
      rows = careers.get(state.player).map(([s]) => {
        const them = data.rows[s].map(r => onSide(r, state.side)).sort((a, b) => b[rk] - a[rk] || b.t - a.t);
        const i = them.findIndex(r => r.id === state.player);
        return Object.assign(them[i], { rank: i + 1, s: +s });
      });
      rows.sort((a, b) => (a[k] - b[k]) * dir || b.s - a.s);
    }
    shown = rows;
    // a team code opens its season on that team; in the season list the chosen team's code clears it
    const teams = (tm, at) => tm.split("/").map(c =>
      `<a href="${esc(addr(at, one || c !== state.team ? c : "", null))}">${esc(c)}</a>`).join("/");
    const cols = COLUMNS[state.view], bold = decomposition ? "a" : SIDE_FIELD[state.side];
    tbody.innerHTML = rows.map(p => {
      const links = teams(p.tm, one ? String(p.s) : state.season);
      const first = one ? `<td class="season">${p.s}${similar.has(p.id + ":" + p.s) ? ` <a class="sim" href="similarity.html#player=${p.id}&amp;season=${p.s}" title="Similarity" aria-label="Similarity, ${p.s}">~</a>` : ""}</td>`
        : `<td class="name"><a href="${esc(addr(state.season, state.team, p.id))}">${esc(p.n)}</a>` +
          (phone.matches ? `<span class="tm">${links}</span>` : "") + `</td>`;
      return `<tr><td class="rank">${p.rank}</td>${first}<td class="team">${links}</td>` + cols.map(([key]) =>
        `<td${key === bold ? ' class="total"' : ""}>${key === "p" ? whole.format(p.p)
          : decomposition ? fmt(p[key]) : fmt1(p[key])}</td>`).join("") + `</tr>`;
    }).join("");

    // the controls: the season list's, or the player's name with the cross back to the list
    document.querySelectorAll("[data-list]").forEach(e => { e.hidden = one; });
    chip.hidden = !one;
    if (one) {
      const name = careers.get(state.player)[0][1].n;
      $("chip-name").textContent = name;
      chip.href = addr(state.season, state.team, null);
      document.title = `${name} · OpenRAPM`;
    } else document.title = "OpenRAPM";
    const seasons = data.meta.seasons.map(String);
    $("older").disabled = state.season === seasons[seasons.length - 1];
    $("newer").disabled = state.season === seasons[0];
    $("side").hidden = !decomposition;
    pieces.setAttribute("aria-pressed", decomposition);
    document.querySelectorAll("[data-side]").forEach(b => b.setAttribute("aria-pressed", b.dataset.side === state.side));
    writeAddress();
  }

  // the CSV: the ratings view gives each side's rating, the decomposition view every side's pieces; both carry
  // the NBA player id, which the table leaves out.  UTF-8 with a byte-order mark so a spreadsheet opens names like
  // Jokić as written
  const CSV_PIECES = ["box_score", "on_court_signal", "off_court_adjustment", "team_sos_adjustment",
                      "swap_adjustment", "openrapm"];
  function downloadCSV(filename, pairs) {
    const q = v => { if (v === null || v === undefined) return "";
                     const s = String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = state.view === "ratings"
      ? [["season", "player_id", "player", "team", "offense", "defense", "total", "possessions"],
         ...pairs.map(([per, x]) => [per, x.id, x.n, x.tm, x.o[5], x.d[5], x.t[5], x.p])]
      : [["season", "player_id", "player", "team", "possessions",
          ...["offense", "defense", "total"].flatMap(s => CSV_PIECES.map(k => s + "_" + k))],
         ...pairs.map(([per, x]) => [per, x.id, x.n, x.tm, x.p, ...x.o, ...x.d, ...x.t])];
    const text = "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
    const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const csvName = what => `openrapm_${state.view === "ratings" ? "ratings" : "decomposition"}_${what}.csv`;
  $("csv-view").addEventListener("click", e => {
    e.preventDefault();
    if (!data) return;
    if (state.player !== null)                        // his seasons, oldest first like the all-seasons file
      return downloadCSV(csvName("player_" + state.player), [...careers.get(state.player)].reverse());
    const ids = new Set(shown.map(r => r.id));
    downloadCSV(csvName(state.season), data.rows[state.season].filter(x => ids.has(x.id)).map(x => [state.season, x]));
  });
  $("csv-all").addEventListener("click", e => {
    e.preventDefault();
    if (!data) return;
    downloadCSV(csvName("all_seasons"), [...data.meta.seasons].reverse().flatMap(per => data.rows[per].map(x => [per, x])));
  });

  // the season's teams, as its box scores abbreviate them; a team the new season lacks goes back to every team
  function fillTeams() {
    const codes = [...new Set(data.rows[state.season].flatMap(r => r.tm.split("/")))].filter(Boolean).sort();
    if (!codes.includes(state.team)) state.team = "";
    team.replaceChildren(...["", ...codes].map(c => option(c, c || "All teams")));
    team.value = state.team;
  }
  // the season changes in place, from the list or the arrows, so Back skips the seasons stepped through
  function setSeason(s) { state.season = season.value = s; fillTeams(); render(); }
  function step(by) {                                 // meta.seasons runs latest first
    const seasons = data.meta.seasons.map(String), next = seasons[seasons.indexOf(state.season) + by];
    if (next !== undefined) setSeason(next);
  }
  season.addEventListener("change", () => setSeason(season.value));
  $("older").addEventListener("click", () => step(1));
  $("newer").addEventListener("click", () => step(-1));
  team.addEventListener("change", () => { state.team = team.value; render(); });
  find.addEventListener("input", () => { state.q = find.value; render(); });
  pieces.addEventListener("click", () => { setView(state.view === "ratings" ? "decomposition" : "ratings"); render(); });
  document.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.side !== state.side) { state.side = b.dataset.side; render(); }
  }));
  // the cross goes Back when this player was opened from a list in this tab; otherwise its link opens the list
  chip.addEventListener("click", e => { if (history.state && history.state.back) { e.preventDefault(); history.back(); } });
  // a link notes how far down its page was, so Back can return there; the click comes before the navigation, so
  // this still writes the entry being left
  history.scrollRestoration = "manual";               // the list is drawn after the browser would restore it
  document.addEventListener("click", e => {
    if (e.target.closest("a[href]")) history.replaceState(Object.assign({}, history.state, { y: scrollY }), "");
  });
  addEventListener("hashchange", () => {
    if (!data) return;                                // the first draw reads the address once the data is in
    const h = new URLSearchParams(location.hash.slice(1)), was = history.state, fromList = state.player === null;
    place(h);
    if (was) state.q = was.q || "";                   // Back or Forward: the place and its Find text, not the buttons
    else { buttons(h); if (state.player === null) state.q = ""; }      // a link to a list opens it unfiltered
    find.value = state.q;
    render();
    if (!was) history.replaceState(Object.assign({}, history.state, { back: fromList && state.player !== null }), "");
    scrollTo(0, (was && was.y) || 0);
  });

  const first = new URLSearchParams(location.hash.slice(1));
  buttons(first);
  state.player = +first.get("player") || null;        // so the header is right while the data loads
  head();
  load().then(d => {
    data = d;
    careers = careersOf(d);
    season.replaceChildren(...d.meta.seasons.map(s => option(String(s), String(s))));
    const now = new URLSearchParams(location.hash.slice(1));
    place(now);
    buttons(now);
    const saved = history.state || {};                // a reload keeps the Find text and where the page was
    state.q = find.value = saved.q || "";
    render();
    if (saved.y) scrollTo(0, saved.y);
    return fetch("data/similarity/player_seasons.json").then(r => r.json()).then(pool => {
      const f = pool.meta.fields, id = f.indexOf("id"), s = f.indexOf("s");
      similar = new Set(pool.rows.map(r => r[id] + ":" + r[s]));
      if (state.player !== null) render();
    }, () => {});                                     // without it the seasons go without their ~
  }).catch(() => { tbody.innerHTML = `<tr><td class="msg" colspan="99">Could not load the data.</td></tr>`; });
})();
</script>
</body>
</html>
